name: DeskBar
options:
  bundleIdPrefix: io.dragontail
  deploymentTarget:
    iOS: "17.0"
    macOS: "13.0"  # SMAppService (Open at Login)
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # the version stamp reads git and writes the built Info.plist
targets:
  DeskBar:
    type: application
    platform: iOS
    sources: [DeskBar, Shared]
    dependencies:
      - target: DeskBarWidget
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/../stamp-version.sh" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"'
        basedOnDependencyAnalysis: false
    info:
      path: DeskBar/Info.plist
      properties:
        CFBundleDisplayName: DeskBar
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: DeskBar reads the height of nearby standing desks and watches for new ones.
        NSLocationWhenInUseUsageDescription: While you scan, DeskBar notes where each desk sounded closest so it can show desks on a map.
        UIBackgroundModes: [bluetooth-central]  # Watch mode: desk-only scan keeps running with the app in the background
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false  # no network code at all, so App Store Connect skips the encryption questions
    settings:
      base:
        # Same ID as DeskBarMac: one App Store record, one listing, Universal Purchase across iPhone and Mac.
        # Bundle IDs are unique across Apple teams: to build your own copy, change io.dragontail to your own prefix.
        PRODUCT_BUNDLE_IDENTIFIER: io.dragontail.deskbar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DeskBarWidget:
    type: app-extension
    platform: iOS
    sources: [DeskBarWidget, Shared]
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/../stamp-version.sh" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"'
        basedOnDependencyAnalysis: false
    info:
      path: DeskBarWidget/Info.plist
      properties:
        CFBundleDisplayName: DeskBar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.dragontail.deskbar.widget
  DeskBarMac:  # the Mac App Store build of ../main.swift; ../build.sh still builds the quick local copy
    type: application
    platform: macOS
    sources:
      - path: ../main.swift
      - path: ../mac  # icon, privacy manifest, entitlements
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/../stamp-version.sh" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"'
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: DeskBar
        PRODUCT_BUNDLE_IDENTIFIER: io.dragontail.deskbar
        CODE_SIGN_ENTITLEMENTS: ../mac/DeskBar.entitlements  # App Sandbox + Bluetooth, required on the Mac App Store
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.0.0"  # stamped from git at build time
        CURRENT_PROJECT_VERSION: "0"
        INFOPLIST_KEY_CFBundleDisplayName: DeskBar
        INFOPLIST_KEY_LSUIElement: YES  # menu bar only, no Dock icon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: DeskBar connects to your standing desk to move it.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
