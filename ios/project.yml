name: DeskBar
options:
  bundleIdPrefix: net.dreamiurg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO  # the version stamp reads git and writes the built Info.plist
targets:
  DeskBar:
    type: application
    platform: iOS
    sources: [DeskBar, Shared]
    dependencies:
      - target: DeskBarWidget
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/../stamp-version.sh" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"'
        basedOnDependencyAnalysis: false
    info:
      path: DeskBar/Info.plist
      properties:
        CFBundleDisplayName: DeskBar
        UILaunchScreen: {}
        NSBluetoothAlwaysUsageDescription: DeskBar reads the height of nearby standing desks and watches for new ones.
        NSLocationWhenInUseUsageDescription: While you scan, DeskBar notes where each desk sounded closest so it can show desks on a map.
        UIBackgroundModes: [bluetooth-central]  # Watch mode: desk-only scan keeps running with the app in the background
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.dreamiurg.deskbar.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DeskBarWidget:
    type: app-extension
    platform: iOS
    sources: [DeskBarWidget, Shared]
    postBuildScripts:
      - name: Stamp version
        script: '"$SRCROOT/../stamp-version.sh" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"'
        basedOnDependencyAnalysis: false
    info:
      path: DeskBarWidget/Info.plist
      properties:
        CFBundleDisplayName: DeskBar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.dreamiurg.deskbar.ios.widget
