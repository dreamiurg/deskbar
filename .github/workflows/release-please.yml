# Keeps a release PR open with the changelog and next version, derived from conventional commits (feat:, fix:).
# Merging that PR tags vX.Y.Z, publishes a GitHub release and bumps version.txt, which the builds stamp into both apps.
name: release-please
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:  # only this job writes: tags/releases and the release PR
      contents: write
      pull-requests: write
    steps:
      # Pinned to a commit: a tag can be moved, and this job holds write access.
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
